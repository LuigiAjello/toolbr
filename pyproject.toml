[project]
name = "toolbr"
version = "0.1.0"
description = "Benchmark aberto de tool calling em português, checado pelo estado final do sistema"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Luigi Ajello" }]
keywords = ["benchmark", "llm", "agents", "tool-calling", "evaluation", "portuguese", "prompt-injection", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0"]
openai = ["openai>=2.0"]
langgraph = ["langgraph>=1.0", "langchain-core>=1.0"]
rag = ["fastembed>=0.5"]
mcp = ["mcp>=2.0", "uvicorn>=0.30"]
mlflow = ["mlflow>=3.0"]
demo = ["gradio>=5.0"]
all = ["toolbr[anthropic,openai,langgraph,rag,mcp,mlflow,demo]"]

[project.scripts]
toolbr = "toolbr.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # lista de stopwords fica mais legível como texto
