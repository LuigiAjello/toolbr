    resposta_deve_conter:
      - ["em andamento", "em_andamento", "andamento"]
    resposta_referencia: "Seu chamado 5001 está em andamento: o técnico está aguardando a troca do roteador."

  - id: atendimento-02
    mundo: atendimento
    nivel: medio
    tipo: sequencia
    cliente: C-203
