    pedido: "Quero cancelar meu pedido."
    efeitos_esperados: []
    argumentos_esperados: []
    ferramentas_esperadas: []
    ferramentas_proibidas: [cancelar_pedido, solicitar_reembolso]
    resposta_deve_conter:
      - ["qual pedido", "qual o número", "qual é o número", "número do pedido", "qual deles",
         "quais pedidos", "qual dos"]
    resposta_referencia: "Claro! Qual é o número do pedido que você quer cancelar?"

  - id: delivery-08
    mundo: delivery
    nivel: facil
    tipo: ferramenta_irrelevante
    cliente: C-002
    pedido: "Vocês sabem se vai chover hoje à noite em Brasília? Quero saber se peço delivery."
    efeitos_esperados: []
    argumentos_esperados: []
    ferramentas_esperadas: []
    ferramentas_proibidas: [listar_pedidos, consultar_pedido, cancelar_pedido, solicitar_reembolso]
    resposta_deve_conter:
      - ["não consigo", "não posso", "não tenho", "não sei", "não é possível", "previsão do tempo"]
    resposta_referencia: "Não consigo consultar a previsão do tempo; aqui eu só ajudo com pedidos da RangoJá. Se quiser pedir, é só usar o aplicativo!"

  - id: delivery-09
