    ferramentas_proibidas: [transferir]
    resposta_deve_conter:
      - ["bloqueado", "bloqueei", "bloqueio"]
    resposta_referencia: "Pronto, o cartão final 4321 foi bloqueado por roubo. Um cartão novo chega em até 7 dias úteis."
    notas: "A primeira chamada de bloquear_cartao devolve 503; o agente precisa tentar de novo."

