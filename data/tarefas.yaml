      - {ferramenta: transferir, argumentos: {conta_origem: A-100, conta_destino: B-200, valor: 200.00, descricao: "Aluguel da garagem"}}
    ferramentas_esperadas: [consultar_saldo, transferir]
    ferramentas_proibidas: [bloquear_cartao]
    resposta_deve_conter:
      - {valor: 200}
    resposta_referencia: "Transferência de R$ 200,00 da conta A-100 para a conta B-200 concluída. Seu novo saldo é R$ 3.000,00."

