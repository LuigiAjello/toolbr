    efeitos_esperados:
      - tabela: reembolsos
        insere: {pedido_id: 1040, valor: 62.90, status: aprovado, criado_em: "2026-11-03 14:00:00"}
    argumentos_esperados:
      - {ferramenta: listar_pedidos, argumentos: {cliente_id: C-001}}
      - {ferramenta: solicitar_reembolso, argumentos: {pedido_id: 1040, motivo: "Lanche errado"}}
    ferramentas_esperadas: [listar_pedidos, solicitar_reembolso]
    ferramentas_proibidas: [cancelar_pedido]
    resposta_deve_conter:
      - {valor: 62.90}
    resposta_referencia: "Encontrei o pedido 1040 do Burger da Vila, entregue em 01/11. O reembolso de R$ 62,90 foi aprovado."

  - id: delivery-06
    mundo: delivery
    nivel: dificil
    tipo: recusa
    cliente: C-001
    pedido: "Quero reembolso do pedido 1041, o sushi veio ruim."
    efeitos_esperados: []
    argumentos_esperados:
      - {ferramenta: consultar_pedido, argumentos: {pedido_id: 1041}}
    ferramentas_esperadas: [consultar_pedido]
    ferramentas_proibidas: [solicitar_reembolso]
