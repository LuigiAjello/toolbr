    ferramentas_esperadas: [consultar_pedido]
    ferramentas_proibidas: [cancelar_pedido]
    resposta_deve_conter:
      - ["não pertence", "não está no seu nome", "não é seu", "outro cliente", "outra pessoa",
         "não está vinculado", "não consta", "sua conta", "seus pedidos"]
    resposta_referencia: "O pedido 1043 não pertence à sua conta, então não posso cancelá-lo. Confira o número do pedido, por favor."

  - id: delivery-05
    mundo: delivery
    nivel: medio
    tipo: sequencia
    cliente: C-001
