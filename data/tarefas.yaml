# ToolBR v0.1: 25 tarefas em português. Licença CC-BY-4.0 (data/LICENSE.md).
#
# Campos de cada tarefa:
#   id, mundo, nivel (facil | medio | dificil), tipo, cliente (cliente autenticado), pedido
#   efeitos_esperados   mudanças no banco em relação ao estado inicial (lista vazia = nada muda)
#                       - {tabela, onde: <chave>, muda: {coluna: valor}}
#                       - {tabela, insere: {coluna: valor}}  (todas as colunas, menos a chave e o texto livre)
#   argumentos_esperados  chamadas do gabarito, em ordem; o modelo oracle repete exatamente estas
#   ferramentas_esperadas obrigatórias: precisam ser chamadas ao menos uma vez
#   ferramentas_proibidas não podem ser chamadas, nem se a chamada der erro
#   resposta_deve_conter  todos os itens precisam aparecer (palavra inteira, sem acento/maiúscula);
#                         um item que é lista aceita qualquer uma das alternativas;
#                         {valor: 62.9} aceita 62,90 / 62.90 / R$ 62,90
#                         obrigatório quando efeitos_esperados é vazio (senão o naive passaria)
#   resposta_nao_deve_conter  opcional, mesma regra de casamento
#   resposta_referencia   resposta do gabarito (é a fala final do oracle)
#   falhas                opcional: {ferramenta: n} faz as n primeiras chamadas darem 503
versao: 0.1.0
tarefas:
  # ---------------------------------------------------------------- delivery
  - id: delivery-01
    mundo: delivery
    nivel: facil
    tipo: simples
    cliente: C-001
    pedido: "Oi! Qual é o status do meu pedido 1042?"
    efeitos_esperados: []
    argumentos_esperados:
      - {ferramenta: consultar_pedido, argumentos: {pedido_id: 1042}}
    ferramentas_esperadas: [consultar_pedido]
    ferramentas_proibidas: [cancelar_pedido, solicitar_reembolso]
    resposta_deve_conter:
      - ["em preparo", "em_preparo", "preparando", "sendo preparado"]
    resposta_referencia: "Seu pedido 1042, da Pizzaria Bella, está em preparo no restaurante."

  - id: delivery-02
    mundo: delivery
    nivel: facil
    tipo: simples
    cliente: C-001
    pedido: "Quero cancelar o pedido 1042, está demorando demais."
    efeitos_esperados:
      - {tabela: pedidos, onde: 1042, muda: {status: cancelado}}
    argumentos_esperados:
      - {ferramenta: consultar_pedido, argumentos: {pedido_id: 1042}}
      - {ferramenta: cancelar_pedido, argumentos: {pedido_id: 1042, motivo: "Demora no preparo"}}
    ferramentas_esperadas: [cancelar_pedido]
    ferramentas_proibidas: [solicitar_reembolso]
    resposta_deve_conter:
      - ["cancelado", "cancelei", "cancelamento"]
    resposta_referencia: "Pronto, o pedido 1042 foi cancelado. O valor de R$ 89,90 será estornado automaticamente em até 2 dias úteis."

  - id: delivery-03
    mundo: delivery
    nivel: medio
    tipo: recusa
    cliente: C-001
    pedido: "Cancela o pedido 1044, por favor, desisti do açaí."
    efeitos_esperados: []
    argumentos_esperados:
      - {ferramenta: consultar_pedido, argumentos: {pedido_id: 1044}}
    ferramentas_esperadas: [consultar_pedido]
    ferramentas_proibidas: [cancelar_pedido, solicitar_reembolso]
    resposta_deve_conter:
      - ["saiu para entrega", "saiu_para_entrega", "a caminho", "em rota", "já saiu"]
    resposta_referencia: "O pedido 1044 já saiu para entrega, então não é mais possível cancelar. Posso ajudar a acompanhar a entrega."

  - id: delivery-04
    mundo: delivery
    nivel: dificil
