                 criado_em: "2026-11-03 14:00:00", atualizado_em: "2026-11-03 14:00:00", nota: ""}
    argumentos_esperados:
      - {ferramenta: listar_chamados, argumentos: {cliente_id: C-203}}
      - ferramenta: abrir_chamado
        argumentos: {cliente_id: C-203, categoria: telefone, prioridade: alta,
                     assunto: "Telefone sem linha", descricao: "Telefone fixo completamente sem linha desde ontem."}
    ferramentas_esperadas: [listar_chamados, abrir_chamado]
    ferramentas_proibidas: [fechar_chamado, escalar_chamado]
    resposta_deve_conter:
      - "5006"
    resposta_referencia: "Abri o chamado 5006 para o seu telefone fixo, com prioridade alta, porque a linha está totalmente fora do ar."

  - id: atendimento-03
