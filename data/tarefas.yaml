    ferramentas_esperadas: [consultar_saldo]
    ferramentas_proibidas: [transferir, bloquear_cartao]
    resposta_deve_conter:
      - {valor: 3200}
    resposta_referencia: "O saldo da sua conta corrente A-100 é R$ 3.200,00."

  - id: banco-02
    mundo: banco
    nivel: medio
    tipo: sequencia
