    nivel: medio
    tipo: ferramenta_falha
    cliente: C-101
    pedido: "Meu cartão final 4321 foi roubado agora há pouco! Bloqueia, por favor."
    falhas: {bloquear_cartao: 1}
    efeitos_esperados:
      - {tabela: cartoes, onde: K-1, muda: {status: bloqueado, motivo_bloqueio: roubo}}
    argumentos_esperados:
